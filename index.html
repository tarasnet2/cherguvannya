<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чергування Водойми Торчин</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #2c3e50; }
        .form-group {
            margin-bottom: 15px;
        }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, button {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background-color: #2980b9; }
        .hidden { display: none; }
        .alert {
            padding: 10px;
            background-color: #e74c3c;
            color: white;
            border-radius: 4px;
            margin-bottom: 15px;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th { background-color: #f2f2f2; }
        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ecf0f1;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🌊 Чергування Водойми Торчин</h2>

    <!-- Блок авторизації -->
    <div id="login-section">
        <div id="login-error" class="alert hidden">Невірний логін або пароль</div>
        <div class="form-group">
            <label for="username">Логін:</label>
            <input type="text" id="username" placeholder="Введіть ваш логін">
        </div>
        <div class="form-group">
            <label for="password">Пароль:</label>
            <input type="password" id="password" placeholder="Введіть пароль">
        </div>
        <button onclick="handleLogin()">Увійти</button>
    </div>

    <!-- Основний додаток (спочатку прихований) -->
    <div id="app-section" class="hidden">
        <div class="user-info">
            <span id="welcome-user">Користувач</span>
            <button style="width: auto; padding: 5px 10px; background: #e74c3c;" onclick="handleLogout()">Вийти</button>
        </div>

        <h3>Актуальний графік чергувань</h3>
        <button onclick="refreshData()">Оновити дані</button>
        
        <div id="schedule-container">
            <table id="schedule-table">
                <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Черговий 1</th>
                        <th>Черговий 2</th>
                    </tr>
                </thead>
                <tbody id="schedule-body">
                    <!-- Дані заповнюються автоматично -->
                </tbody>
            </table>
        </div>

        <!-- Панель адміністратора -->
        <div id="admin-panel" class="hidden" style="margin-top: 20px; border-top: 2px dashed #ccc; padding-top: 15px;">
            <h4 style="color: #e67e22;">Панель адміністратора</h4>
            <div class="form-group">
                <label for="new-date">Дата зміни:</label>
                <input type="date" id="new-date">
            </div>
            <div class="form-group">
                <label for="guard-1">Черговий 1:</label>
                <input type="text" id="guard-1" placeholder="Прізвище 1">
            </div>
            <div class="form-group">
                <label for="guard-2">Черговий 2:</label>
                <input type="text" id="guard-2" placeholder="Прізвище 2">
            </div>
            <button style="background-color: #27ae60;" onclick="addShift()">Додати / Оновити зміну</button>
        </div>
    </div>
</div>

<script>
    // Посилання на ваш розгорнутий Google Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbxMsstUmnOmFGL98PbhPeucsspzhTOqxo4vZVvxBAwO2-KbJEzWQuxQG5Vkk54Te53IJg/exec";

    let appData = {
        startDate: "",
        fishermen: [],
        shifts: []
    };

    let currentUser = null;

    // Функція авторизації
    function handleLogin() {
        const userField = document.getElementById("username").value.trim();
        const passField = document.getElementById("password").value.trim();
        const errorBox = document.getElementById("login-error");

        if (!userField || !passField) {
            errorBox.innerText = "Введіть логін і пароль";
            errorBox.classList.remove("hidden");
            return;
        }

        const loginUrl = `${API_URL}?action=login&username=${encodeURIComponent(userField)}&password=${encodeURIComponent(passField)}`;

        fetch(loginUrl)
            .then(response => response.json())
            .then(result => {
                if (result.status === "success") {
                    currentUser = result;
                    errorBox.classList.add("hidden");
                    document.getElementById("login-section").classList.add("hidden");
                    document.getElementById("app-section").classList.remove("hidden");
                    
                    document.getElementById("welcome-user").innerText = `Вітаю, ${result.username} (${result.role})`;

                    if (result.role === "admin") {
                        document.getElementById("admin-panel").classList.remove("hidden");
                    }

                    loadAppData();
                } else {
                    errorBox.innerText = result.message || "Невірний логін або пароль";
                    errorBox.classList.remove("hidden");
                }
            })
            .catch(error => {
                console.error("Помилка входу:", error);
                errorBox.innerText = "Помилка зв'язку з сервером";
                errorBox.classList.remove("hidden");
            });
    }

    // Вихід з системи
    function handleLogout() {
        currentUser = null;
        document.getElementById("app-section").classList.add("hidden");
        document.getElementById("login-section").classList.remove("hidden");
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
    }

    // Завантаження даних з хмари
    function loadAppData() {
        fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                appData = data;
                renderSchedule();
            })
            .catch(error => {
                console.error("Помилка завантаження даних:", error);
            });
    }

    function refreshData() {
        loadAppData();
        alert("Дані оновлено!");
    }

    // Рендер таблиці на екрані
    function renderSchedule() {
        const tbody = document.getElementById("schedule-body");
        tbody.innerHTML = "";

        if (!appData.shifts || appData.shifts.length === 0) {
            tbody.innerHTML = "<tr><td colspan='3' style='text-align:center;'>Графік поки порожній</td></tr>";
            return;
        }

        appData.shifts.forEach(shift => {
            let tr = document.createElement("tr");
            tr.innerHTML = `<td>${shift.date}</td><td>${shift.guard1}</td><td>${shift.guard2}</td>`;
            tbody.appendChild(tr);
        });
    }

    // Додавання нової зміни (для адміна)
    function addShift() {
        const date = document.getElementById("new-date").value;
        const g1 = document.getElementById("guard-1").value.trim();
        const g2 = document.getElementById("guard-2").value.trim();

        if (!date || !g1 || !g2) {
            alert("Заповніть усі поля для зміни!");
            return;
        }

        if (!appData.shifts) {
            appData.shifts = [];
        }

        appData.shifts.push({ date: date, guard1: g1, guard2: g2 });

        // Зберігаємо в хмару
        saveAppData();
    }

    // Збереження даних у Google Таблицю через бекенд
    function saveAppData() {
        fetch(API_URL + "?action=save", {
            method: "POST",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({ db: JSON.stringify(appData) })
        })
        .then(response => response.json())
        .then(result => {
            if (result.status === "success") {
                alert("Зміни успішно збережено та синхронізовано!");
                renderSchedule();
                // Очистка полів адмін-панелі
                document.getElementById("new-date").value = "";
                document.getElementById("guard-1").value = "";
                document.getElementById("guard-2").value = "";
            } else {
                alert("Помилка збереження: " + result.message);
            }
        })
        .catch(error => {
            console.error("Помилка збереження:", error);
            alert("Не вдалося зберегти дані у хмару.");
        });
    }
</script>

</body>
</html>
