<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌊 Чергування Водойми Торчин</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --danger: #ef4444;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 5px;
        }

        .container {
            max-width: 800px;
            margin: 10px auto;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
        }

        h2, h3, h4 {
            text-align: center;
            color: var(--accent);
            margin-top: 10px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            color: var(--text);
            font-size: 14px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background: #f8fafc;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            margin-top: 8px;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-green { background: var(--accent-green); }
        .btn-danger { background: var(--danger); }

        .hidden { display: none !important; }

        .alert {
            padding: 10px;
            background-color: #fee2e2;
            border: 1px solid #f87171;
            color: #991b1b;
            border-radius: 8px;
            margin-bottom: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }

        .user-header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #e0f2fe;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #bae6fd;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }

        @media (min-width: 480px) {
            .user-header {
                flex-direction: row;
                justify-content: space-between;
                text-align: left;
            }
        }

        .nav-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .nav-tab {
            flex: 1;
            padding: 8px 6px;
            background: #f1f5f9;
            border: 1px solid var(--border);
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 13px;
            white-space: nowrap;
        }

        .nav-tab.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .calendar-header button {
            padding: 6px 10px;
            font-size: 13px;
            width: auto;
            margin: 0;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .calendar-day-name {
            text-align: center;
            font-weight: bold;
            color: var(--text-muted);
            font-size: 12px;
            padding-bottom: 4px;
        }

        /* Роббимо сітку днів квадратною та адаптивною */
        .cal-day {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            aspect-ratio: 1 / 1; /* Робить клітинку строго квадратною */
            padding: 4px;
            font-size: 9px;
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow: hidden;
        }

        .cal-day.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        .cal-date-num {
            font-weight: bold;
            color: var(--text);
            font-size: 11px;
            margin-bottom: 2px;
        }

        .shift-badge {
            font-size: 8px;
            padding: 2px 3px;
            border-radius: 4px;
            line-height: 1.1;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3; /* Обмежує текст до 3 рядків */
            -webkit-box-orient: vertical;
        }

        .badge-pending { background: #fef3c7; color: #b45309; border: 1px solid #f59e0b; }
        .badge-confirmed { background: #d1fae5; color: #065f46; border: 1px solid #10b981; }

        .stats-card {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .badge-count {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }
        .count-done { background: #d1fae5; color: #065f46; }
        .count-none { background: #fee2e2; color: #991b1b; }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 15px;
            box-sizing: border-box;
            backdrop-filter: blur(2px);
        }
        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            border: 1px solid var(--border);
            box-shadow: 0 15px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🌊 Водойма Торчин</h2>

    <!-- БЛОК АВТОРИЗАЦІЇ -->
    <div id="login-section">
        <div id="login-error" class="alert hidden">Невірний логін або пароль</div>
        <div class="form-group">
            <label for="username">Логін (Прізвище та Ім'я або admin):</label>
            <input type="text" id="username" placeholder="Наприклад: admin або Петренко Тарас">
        </div>
        <div class="form-group">
            <label for="password">Пароль:</label>
            <input type="password" id="password" placeholder="Введіть пароль">
        </div>
        <button onclick="handleLogin()">Увійти в систему</button>
    </div>

    <!-- ОСНОВНИЙ ІНТЕРФЕЙС -->
    <div id="app-section" class="hidden">
        <div class="user-header">
            <span id="welcome-user" style="font-weight: bold; color: var(--accent);">Вітаю</span>
            <button class="btn-danger" style="width: auto; padding: 5px 10px; margin: 0; font-size: 13px;" onclick="handleLogout()">Вийти</button>
        </div>

        <!-- Меню вкладок -->
        <div class="nav-tabs">
            <div class="nav-tab active" onclick="switchTab('calendar', event)">📅 Календар</div>
            <div class="nav-tab" onclick="switchTab('stats', event)">📊 Хто вартував</div>
            <div id="admin-tab-btn" class="nav-tab hidden" onclick="switchTab('admin', event)">⚙️ Адмін (<span id="pending-count">0</span>)</div>
        </div>

        <!-- ВКЛАДКА 1: КАЛЕНДАР НА МІСЯЦЬ -->
        <div id="tab-calendar" class="tab-content">
            <div class="calendar-header">
                <button onclick="changeMonth(-1)">◀ Мін.</button>
                <h3 id="calendar-month-title" style="margin: 0; font-size: 16px;">Жовтень 2026</h3>
                <button onclick="changeMonth(1)">Наст. ▶</button>
            </div>
            <div class="calendar-grid" id="calendar-grid-header" style="margin-top: 10px;">
                <div class="calendar-day-name">Пн</div>
                <div class="calendar-day-name">Вт</div>
                <div class="calendar-day-name">Ср</div>
                <div class="calendar-day-name">Чт</div>
                <div class="calendar-day-name">Пт</div>
                <div class="calendar-day-name">Сб</div>
                <div class="calendar-day-name">Нд</div>
            </div>
            <div class="calendar-grid" id="calendar-days-container" style="margin-top: 5px;"></div>
            <p style="font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 12px;">
                💡 Натисніть на день, щоб призначити або забронювати варту.
            </p>
        </div>

        <!-- ВКЛАДКА 2: СТАТИСТИКА -->
        <div id="tab-stats" class="tab-content hidden">
            <h3>📇 Облік варти рибалок</h3>
            <p style="font-size: 12px; color: var(--text-muted); text-align: center;">Кількість виходів на охорону водойми:</p>
            <div id="fishermen-stats-list" style="max-height: 380px; overflow-y: auto; padding-right: 3px; margin-top: 10px;"></div>
        </div>

        <!-- ВКЛАДКА 3: АДМІНІСТРУВАННЯ -->
        <div id="tab-admin" class="tab-content hidden">
            <h3>🛡️ Підтвердження бронювань</h3>
            <div id="admin-requests-list" style="margin-top: 10px;"></div>
        </div>
    </div>
</div>

<!-- МОДАЛЬНЕ ВІКНО -->
<div id="booking-modal" class="modal hidden">
    <div class="modal-content">
        <h3 id="modal-date-title" style="margin-top: 0;">Бронювання дати</h3>
        <p id="modal-date-info" style="font-size: 13px; color: var(--text-muted); text-align: center; margin: 8px 0 12px 0;"></p>
        
        <div class="form-group" id="booking-select-group">
            <label for="booking-primary">Перший рибалка:</label>
            <select id="booking-primary"></select>
        </div>

        <div class="form-group" id="booking-select-group-2">
            <label for="booking-partner">Другий рибалка (необов'язково):</label>
            <select id="booking-partner">
                <option value="">-- Без напарника (один) --</option>
            </select>
        </div>

        <div id="booking-actions">
            <button class="btn-green" onclick="submitBooking()">Зберегти / Забронювати</button>
        </div>
        <button style="background: #64748b; margin-top: 6px;" onclick="closeModal()">Закрити</button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxMsstUmnOmFGL98PbhPeucsspzhTOqxo4vZVvxBAwO2-KbJEzWQuxQG5Vkk54Te53IJg/exec";

    let appData = {
        fishermen: [
            "Петренко Тарас", "Вовк Олександр", "Замелюк Володимир", "Стоянович Олександр", "Біда Павло",
            "Ковальчук Іван", "Борисюк Андрій", "Грицюк Микола", "Панасюк Сергій", "Левчук Олег",
            "Марчук Василь", "Климюк Дмитро", "Шевчук Віктор", "Романюк Петро", "Онюк Степан",
            "Савчук Михайло", "Демчук Юрій", "Павлюк Анатолій", "Гончарук Василь", "Ткачук Микола",
            "Коваль Павло", "Бондар Олег", "Мельник Іван", "Олійник Віктор", "Кравець Андрій",
            "Поліщук Сергій", "Ящук Дмитро", "Сидорчук Василь", "Козак Петро", "Ващук Михайло",
            "Руденко Юрій", "Литвинюк Анатолій", "Пасічник Степан", "Гнатюк Олег", "Терещук Іван",
            "Матвійчук Василь", "Дчук Микола", "Шеремета Павло", "Кузьмич Андрій", "Федорчук Сергій"
        ],
        shifts: []
    };

    let currentUser = null;
    let currentNavDate = new Date();
    let selectedDateStr = null;

    function handleLogin() {
        const userField = document.getElementById("username").value.trim();
        const passField = document.getElementById("password").value.trim();
        const errorBox = document.getElementById("login-error");

        if (!userField || !passField) {
            errorBox.innerText = "Введіть логін і пароль";
            errorBox.classList.remove("hidden");
            return;
        }

        if (userField.toLowerCase() === "admin" && passField === "admin123") {
            grantAccess({ username: "Адміністратор", role: "admin" });
            return;
        }

        const loginUrl = `${API_URL}?action=login&username=${encodeURIComponent(userField)}&password=${encodeURIComponent(passField)}`;

        fetch(loginUrl)
            .then(res => res.json())
            .then(result => {
                if (result.status === "success") {
                    grantAccess(result);
                } else {
                    let foundFisherman = appData.fishermen.find(f => f.toLowerCase() === userField.toLowerCase() || f.toLowerCase().includes(userField.toLowerCase()));
                    if (foundFisherman) {
                        grantAccess({ username: foundFisherman, role: "user" });
                    } else {
                        errorBox.innerText = result.message || "Невірний логін або пароль";
                        errorBox.classList.remove("hidden");
                    }
                }
            })
            .catch(err => {
                grantAccess({ username: userField, role: userField.toLowerCase() === "admin" ? "admin" : "user" });
            });
    }

    function grantAccess(userData) {
        currentUser = userData;
        document.getElementById("login-error").classList.add("hidden");
        document.getElementById("login-section").classList.add("hidden");
        document.getElementById("app-section").classList.remove("hidden");
        
        document.getElementById("welcome-user").innerText = `🎣 ${currentUser.username} (${currentUser.role === 'admin' ? 'Адмін' : 'Учасник'})`;

        if (currentUser.role === "admin") {
            document.getElementById("admin-tab-btn").classList.remove("hidden");
        } else {
            document.getElementById("admin-tab-btn").classList.add("hidden");
        }

        loadAppData();
    }

    function handleLogout() {
        currentUser = null;
        document.getElementById("app-section").classList.add("hidden");
        document.getElementById("login-section").classList.remove("hidden");
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
    }

    function loadAppData() {
        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                if (data && data.shifts) appData.shifts = data.shifts;
                if (data && data.fishermen && data.fishermen.length > 0) appData.fishermen = data.fishermen;
                renderAll();
            })
            .catch(err => {
                renderAll();
            });
    }

    function saveToCloud() {
        fetch(API_URL + "?action=save", {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ db: JSON.stringify(appData) })
        })
        .then(res => res.json())
        .then(res => { renderAll(); })
        .catch(err => { renderAll(); });
    }

    function switchTab(tabName, event) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));

        if (tabName === 'calendar') {
            document.getElementById('tab-calendar').classList.remove('hidden');
            event.target.classList.add('active');
        } else if (tabName === 'stats') {
            document.getElementById('tab-stats').classList.remove('hidden');
            event.target.classList.add('active');
            renderStats();
        } else if (tabName === 'admin') {
            document.getElementById('tab-admin').classList.remove('hidden');
            document.getElementById('admin-tab-btn').classList.add('active');
            renderAdminRequests();
        }
    }

    function renderCalendar() {
        const year = currentNavDate.getFullYear();
        const month = currentNavDate.getMonth();
        
        const monthNames = ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"];
        document.getElementById("calendar-month-title").innerText = `${monthNames[month]} ${year}`;

        const container = document.getElementById("calendar-days-container");
        container.innerHTML = "";

        const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
        const totalDays = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDayIndex; i++) {
            let cell = document.createElement("div");
            cell.className = "cal-day empty";
            container.appendChild(cell);
        }

        for (let day = 1; day <= totalDays; day++) {
            let cell = document.createElement("div");
            cell.className = "cal-day";
            
            let monthStr = String(month + 1).padStart(2, '0');
            let dayStr = String(day).padStart(2, '0');
            let dateStr = `${year}-${monthStr}-${dayStr}`;

            let shift = appData.shifts.find(s => s.date === dateStr);

            let htmlContent = `<div class="cal-date-num">${day}</div>`;
            
            if (shift) {
                let g1Short = shift.guard1.split(' ')[0]; // Прізвище першого
                let g2Short = shift.guard2 ? shift.guard2.split(' ')[0] : '';
                let displayGuards = shift.guard2 ? `${g1Short}<br>${g2Short}` : `${g1Short}`;

                if (shift.status === 'confirmed') {
                    htmlContent += `<div class="shift-badge badge-confirmed" title="Сторожують: ${shift.guard1} ${shift.guard2 ? 'та ' + shift.guard2 : ''}">🛡️ ${displayGuards}</div>`;
                } else {
                    htmlContent += `<div class="shift-badge badge-pending" title="Очікує підтвердження">⏳ ${g1Short}</div>`;
                }
            }

            cell.innerHTML = htmlContent;
            cell.onclick = () => openBookingModal(dateStr, shift);
            container.appendChild(cell);
        }

        let pendingCount = appData.shifts.filter(s => s.status === 'pending').length;
        document.getElementById("pending-count").innerText = pendingCount;
    }

    function changeMonth(direction) {
        currentNavDate.setMonth(currentNavDate.getMonth() + direction);
        renderCalendar();
    }

    function openBookingModal(dateStr, existingShift) {
        selectedDateStr = dateStr;
        document.getElementById("modal-date-title").innerText = `Дата: ${dateStr}`;
        
        let primarySelect = document.getElementById("booking-primary");
        let partnerSelect = document.getElementById("booking-partner");
        
        primarySelect.innerHTML = "";
        partnerSelect.innerHTML = `<option value="">-- Без напарника (один) --</option>`;

        appData.fishermen.forEach(f => {
            let opt1 = document.createElement("option");
            opt1.value = f;
            opt1.innerText = f;
            primarySelect.appendChild(opt1);

            let opt2 = document.createElement("option");
            opt2.value = f;
            opt2.innerText = f;
            partnerSelect.appendChild(opt2);
        });

        if (currentUser && currentUser.role !== 'admin') {
            primarySelect.value = currentUser.username;
            primarySelect.disabled = true;
        } else {
            primarySelect.disabled = false;
            if (currentUser) primarySelect.value = currentUser.username;
        }

        let infoText = document.getElementById("modal-date-info");
        let actionsBlock = document.getElementById("booking-actions");
        let selectGroup1 = document.getElementById("booking-select-group");
        let selectGroup2 = document.getElementById("booking-select-group-2");

        let existingAdminBtns = document.getElementById("modal-admin-actions");
        if (existingAdminBtns) existingAdminBtns.remove();

        if (existingShift) {
            let guardsText = existingShift.guard2 ? `${existingShift.guard1} та ${existingShift.guard2}` : `${existingShift.guard1} (один)`;
            
            if (existingShift.status === 'confirmed') {
                infoText.innerHTML = `Варта підтверджена:<br><b>${guardsText}</b>`;
                selectGroup1.classList.add("hidden");
                selectGroup2.classList.add("hidden");
                actionsBlock.classList.add("hidden");
                
                if (currentUser && currentUser.role === 'admin') {
                    let adminDiv = document.createElement("div");
                    adminDiv.id = "modal-admin-actions";
                    adminDiv.innerHTML = `<button class="btn-danger" style="margin-top: 8px;" onclick="rejectShift('${dateStr}')">Скасувати варту</button>`;
                    actionsBlock.parentNode.insertBefore(adminDiv, actionsBlock);
                }
            } else {
                infoText.innerHTML = `Заявка від:<br><b>${guardsText}</b><br><span style="color: #f59e0b; font-weight: bold;">Очікує підтвердження!</span>`;
                selectGroup1.classList.add("hidden");
                selectGroup2.classList.add("hidden");
                actionsBlock.classList.add("hidden");

                if (currentUser && currentUser.role === 'admin') {
                    let adminDiv = document.createElement("div");
                    adminDiv.id = "modal-admin-actions";
                    adminDiv.innerHTML = `
                        <button class="btn-green" style="margin-top: 8px;" onclick="confirmShift('${dateStr}')">Підтвердити</button>
                        <button class="btn-danger" style="margin-top: 4px;" onclick="rejectShift('${dateStr}')">Відхилити</button>
                    `;
                    actionsBlock.parentNode.insertBefore(adminDiv, actionsBlock);
                }
            }
        } else {
            infoText.innerHTML = `Оберіть учасників та надішліть заявку або призначте варту.`;
            selectGroup1.classList.remove("hidden");
            selectGroup2.classList.remove("hidden");
            actionsBlock.classList.remove("hidden");
        }

        document.getElementById("booking-modal").classList.remove("hidden");
    }

    function closeModal() {
        document.getElementById("booking-modal").classList.add("hidden");
    }

    function submitBooking() {
        let primary = document.getElementById("booking-primary").value;
        let partner = document.getElementById("booking-partner").value;

        if (!primary) {
            alert("Оберіть рибалку!");
            return;
        }

        if (partner && primary === partner) {
            alert("Перший рибалка і напарник не можуть бути однією людиною!");
            return;
        }

        let statusVal = (currentUser && currentUser.role === 'admin') ? 'confirmed' : 'pending';

        appData.shifts.push({
            date: selectedDateStr,
            guard1: primary,
            guard2: partner || "",
            status: statusVal
        });

        saveToCloud();
        closeModal();
        alert(currentUser && currentUser.role === 'admin' ? "Варту успішно призначено!" : "Бронювання надіслано на підтвердження!");
    }

    function renderStats() {
        const container = document.getElementById("fishermen-stats-list");
        container.innerHTML = "";

        let counts = {};
        appData.fishermen.forEach(f => counts[f] = 0);

        appData.shifts.forEach(s => {
            if (s.status === 'confirmed') {
                if (s.guard1 && counts[s.guard1] !== undefined) counts[s.guard1]++;
                if (s.guard2 && counts[s.guard2] !== undefined) counts[s.guard2]++;
            }
        });

        appData.fishermen.forEach(f => {
            let total = counts[f] || 0;
            let card = document.createElement("div");
            card.className = "stats-card";
            
            let badgeHtml = total > 0 
                ? `<span class="badge-count count-done">🛡️ Вартостей: ${total}</span>` 
                : `<span class="badge-count count-none">⚠️ Ще ні</span>`;

            card.innerHTML = `<span style="font-size: 13px;"><b>${f}</b></span>${badgeHtml}`;
            container.appendChild(card);
        });
    }

    function renderAdminRequests() {
        const container = document.getElementById("admin-requests-list");
        container.innerHTML = "";

        let pendingShifts = appData.shifts.filter(s => s.status === 'pending');

        if (pendingShifts.length === 0) {
            container.innerHTML = `<p style="text-align: center; color: var(--text-muted); margin-top: 15px; font-size: 13px;">Немає нових заяв на бронювання.</p>`;
            return;
        }

        pendingShifts.forEach(shift => {
            let card = document.createElement("div");
            card.className = "stats-card";
            card.style.flexDirection = "column";
            card.style.alignItems = "flex-start";
            card.style.gap = "6px";

            let guardsText = shift.guard2 ? `${shift.guard1} та ${shift.guard2}` : `${shift.guard1} (один)`;

            card.innerHTML = `
                <div style="font-size: 13px;">📅 Дата: <b>${shift.date}</b></div>
                <div style="font-size: 13px;">🎣 Хто заступає: <b>${guardsText}</b></div>
                <div style="display: flex; gap: 8px; width: 100%; margin-top: 4px;">
                    <button class="btn-green" style="margin:0; padding: 8px; font-size: 13px;" onclick="confirmShift('${shift.date}')">Підтвердити</button>
                    <button class="btn-danger" style="margin:0; padding: 8px; font-size: 13px;" onclick="rejectShift('${shift.date}')">Відхилити</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function confirmShift(dateStr) {
        let shift = appData.shifts.find(s => s.date === dateStr);
        if (shift) {
            shift.status = 'confirmed';
            saveToCloud();
            closeModal();
            alert("Варту успішно підтверджено!");
        }
    }

    function rejectShift(dateStr) {
        appData.shifts = appData.shifts.filter(s => s.date !== dateStr);
        saveToCloud();
        closeModal();
        alert("Заявку відхилено / варту скасовано.");
    }

    function renderAll() {
        renderCalendar();
        if (!document.getElementById("tab-stats").classList.contains("hidden")) renderStats();
        if (!document.getElementById("tab-admin").classList.contains("hidden")) renderAdminRequests();
    }
</script>

</body>
</html>
