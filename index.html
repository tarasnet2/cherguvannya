<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чергування Водойми Торчин</title>
  <style>
    :root {
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
      --danger: #ef4444;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 5px;
    }
    .container {
      max-width: 800px;
      margin: 10px auto;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }
    h2, h3, h4 {
      text-align: center;
      color: var(--accent);
      margin-top: 10px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
      color: var(--text);
      font-size: 14px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      background: #f8fafc;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      margin-top: 8px;
    }
    button:active {
      transform: scale(0.98);
    }
    .btn-green { background: var(--accent-green); }
    .btn-danger { background: var(--danger); }
    .btn-orange { background: var(--accent-orange); }
    .hidden { display: none !important; }
    .alert {
      padding: 10px;
      background-color: #fee2e2;
      border: 1px solid #f87171;
      color: #991b1b;
      border-radius: 8px;
      margin-bottom: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
    }
    .user-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #e0f2fe;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #bae6fd;
      margin-bottom: 15px;
      font-size: 14px;
    }
    .nav-tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
      overflow-x: auto;
    }
    .nav-tab {
      flex: 1;
      padding: 8px 6px;
      background: #f1f5f9;
      border: 1px solid var(--border);
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .nav-tab.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .calendar-header button {
      padding: 6px 10px;
      font-size: 13px;
      width: auto;
      margin: 0;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }
    .calendar-day-name {
      text-align: center;
      font-weight: bold;
      color: var(--text-muted);
      font-size: 12px;
      padding-bottom: 4px;
    }
    .cal-day {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      aspect-ratio: 1/1;
      padding: 4px;
      font-size: 9px;
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow: hidden;
    }
    .cal-day.empty {
      background: transparent;
      border: none;
      cursor: default;
    }
    .cal-date-num {
      font-weight: bold;
      color: var(--text);
      font-size: 11px;
      margin-bottom: 2px;
    }
    .shift-badge {
      font-size: 8px;
      padding: 2px 3px;
      border-radius: 4px;
      line-height: 1.1;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }
    .badge-pending { background: #fef3c7; color: #b45309; border: 1px solid #f59e0b; }
    .badge-confirmed { background: #d1fae5; color: #065f46; border: 1px solid #10b981; }
    .stats-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .badge-count {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
    }
    .count-done { background: #d1fae5; color: #065f46; }
    .count-none { background: #fee2e2; color: #991b1b; }
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 15px;
      box-sizing: border-box;
      backdrop-filter: blur(2px);
    }
    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      border: 1px solid var(--border);
      box-shadow: 0 15px 25px rgba(0,0,0,0.1);
    }
    .edit-name-group {
      display: flex;
      gap: 6px;
      width: 100%;
    }
    .edit-name-input {
      padding: 4px 8px;
      font-size: 13px;
      margin: 0;
    }
    .sync-status {
      font-size: 11px;
      color: var(--accent);
      text-align: right;
      margin
